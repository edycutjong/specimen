name: CI
# Typecheck, the vitest + fast-check suite, the seed-fixture check and the exact Vercel build, on two Node versions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: typecheck · test · build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Tests (vitest + fast-check)
        run: npm test
      - name: Seed fixture check
        run: npm run seed:check
      # the exact Vercel build (vercel.json buildCommand): the cabinet, then the landing, the deck and /static/replay.js
      - name: Build the site as Vercel does
        run: npm run build -w apps/cabinet && npx vite build --config site/vite.config.ts
      - name: The deployed files exist
        run: |
          for f in index.html landing/index.html deck/index.html static/replay.js static/repo.json; do
            test -s "apps/cabinet/dist/$f" || { echo "::error::missing apps/cabinet/dist/$f"; exit 1; }
          done

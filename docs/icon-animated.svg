<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SPECIMEN JAR — replays real agent MCP calls against a changed server. An iron shelf of glowing specimen jars; after the server swap, the broken ones rattle, flood red, and print ABNORMAL.">
<title>SPECIMEN JAR — replays real agent MCP calls against a changed server. An iron shelf of glowing specimen jars; after the server swap, the broken ones rattle, flood red, and print ABNORMAL.</title>
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: night-lab plate, barred storm window, one jar with iron neck bolts glowing green, the curled { specimen
          drifting, a blank manila toe-tag — the poster (no text anywhere)
  10-28%  trigger: lightning draws itself down the window (the replay firing) and flashes the plate        data-story="beat-2"
  28-45%  mechanism: An iron shelf of glowing specimen jars; after the server swap, the broken ones rattle, flood red, and print ABNORMAL.
          (the jar rattles three times in 600 ms at 30 %, red floods bottom-up, the specimen twitches, the toe-tag's
          red strip prints in four steps, rattle arcs appear)                                         data-story="beat-3"
  45-80%  resolution: held red — the flood, strip and arcs stay; the red glow breathes                 data-story="beat-4"
  80-100% breathe; seam fade 92-98 % back to the green poster
-->
<defs>
  <linearGradient id="ip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2219"/><stop offset="1" stop-color="#10150F"/></linearGradient>
  <radialGradient id="ist" cx="50%" cy="20%" r="55%"><stop offset="0" stop-color="#C9D6F2" stop-opacity="0.34"/><stop offset="1" stop-color="#C9D6F2" stop-opacity="0"/></radialGradient>
  <radialGradient id="iG" cx="50%" cy="60%" r="50%"><stop offset="0" stop-color="#A8E35F" stop-opacity="0.32"/><stop offset="1" stop-color="#A8E35F" stop-opacity="0"/></radialGradient>
  <radialGradient id="iR" cx="50%" cy="60%" r="50%"><stop offset="0" stop-color="#FF4A2E" stop-opacity="0.6"/><stop offset="1" stop-color="#FF4A2E" stop-opacity="0"/></radialGradient>
  <linearGradient id="ifl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6FF9A"/><stop offset="0.35" stop-color="#A8E35F"/><stop offset="1" stop-color="#4F8A2A"/></linearGradient>
  <linearGradient id="ird" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A6C"/><stop offset="0.3" stop-color="#FF4A2E"/><stop offset="1" stop-color="#8E1C12"/></linearGradient>
  <linearGradient id="iir" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A3AC9F"/><stop offset="0.45" stop-color="#5A6257"/><stop offset="1" stop-color="#2A3028"/></linearGradient>
  <filter id="iglow" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="iinner"><path d="M52 146 Q30 150 30 178 L30 408 Q30 430 52 430 L204 430 Q226 430 226 408 L226 178 Q226 150 204 146 Z"/></clipPath>
  <clipPath id="iplate"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  <clipPath id="istrip"><rect x="-70" y="12" width="0" height="26"><animate attributeName="width" values="0;38;76;114;150;0;0" keyTimes="0;0.34;0.355;0.37;0.385;0.975;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></rect></clipPath>
</defs>
<style>
  .breath { animation: breath 6s ease-in-out infinite; }
  @keyframes breath { 0%, 45% { opacity: 1; } 62% { opacity: 0.62; } 80% { opacity: 1; } 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
